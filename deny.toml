# Supply-chain gate: `cargo deny check`. Every exception needs a one-line reason in this file.

[graph]
all-features = false
no-default-features = false

[advisories]
yanked = "deny"
unsound = "all"
unmaintained = "all"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]

[bans]
multiple-versions = "deny"
wildcards = "allow"   # cargo-deny reports `workspace = true` lines as wildcards; none are real.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
