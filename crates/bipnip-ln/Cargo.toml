[package]
name = "bipnip-ln"
description = "Lightning backends (LND, Core Lightning, LDK) behind one trait, for the bipnip agent and the bipnipd instance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The LND backend. Off by default: building fedimint-tonic-lnd needs `protoc`.
lnd = ["dep:fedimint-tonic-lnd", "dep:rustls", "dep:tokio"]
# The Core Lightning backend: lightningd's JSON-RPC socket, with the `hold` plugin for hold invoices.
cln = ["dep:cln-rpc", "dep:serde_json", "dep:tokio", "tokio/rt"]
# The LDK backend: an LDK Server (ldk-server) over its gRPC API. Its client is a git dependency.
ldk = ["dep:ldk-server-client", "dep:tokio"]

[dependencies]
async-trait.workspace = true
# The LND client mostrod uses (bipnipd moves onto this backend).
fedimint-tonic-lnd = { version = "0.4.0", optional = true }
# fedimint-tonic-lnd's TLS (rustls 0.23) needs a process-wide crypto provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
tokio = { version = "1", features = ["time"], optional = true }
# Core Lightning's own JSON-RPC client (the socket lightning-cli uses).
cln-rpc = { version = "0.7", optional = true }
serde_json = { version = "1", optional = true }
# LDK Server's own client, at the revision the harness builds the server from. Not on crates.io.
ldk-server-client = { git = "https://github.com/lightningdevkit/ldk-server", rev = "d7e7a2e708664af922c53c786ad6a5df622f5dd8", optional = true }

[lints]
workspace = true
