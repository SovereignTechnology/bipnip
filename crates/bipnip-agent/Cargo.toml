[package]
name = "bipnip-agent"
description = "The bipnip agent: runs next to a node runner's Lightning node, holds its keys, trades fiat and liquidity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bipnip-agent"
path = "src/main.rs"

[features]
# Talk to an LND node (needs `protoc` at build time; see bipnip-ln).
lnd = ["bipnip-ln/lnd"]
# Talk to an LDK Server (ldk-server) over its gRPC API; see bipnip-ln's `ldk` module for its limits.
ldk = ["bipnip-ln/ldk"]

[dependencies]
bipnip-ln.workspace = true
async-trait.workspace = true
# The crate nostr's NIP-06 uses; `rand` to generate a new mnemonic.
bip39 = { version = "2.1", features = ["rand"] }
libc = "0.2"
getrandom = "0.3"
# BOLT 11 decoding, to check a seller's invoice before paying it.
lightning-invoice = { version = "0.34", features = ["std"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
# Lease state on disk.
serde_json = "1"
# `net` and `io-util` for the daemon's unix socket, `sync` for its queues.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
toml = "0.8"
# bipnip-core main (#7): Mostro's protocol types and transport, the node binding, and leases and
# rings (terms, messages, order events).
mostro-core = { git = "https://github.com/SovereignTechnology/bipnip-core", rev = "752279d811753ce95dec1fdf8cceb5e217d08f33" }
# The versions bipnip-core resolves, so key and event types are the same types.
nostr-sdk = "0.45.1"
# NIP-06 (mnemonic → keys) is a feature of the nostr crate nostr-sdk re-exports.
nostr = { version = "0.45.1", features = ["nip06"] }
# Order ids in Mostro messages, and in the daemon's requests.
uuid = { version = "1", features = ["serde"] }
zeroize = "1"
secp256k1 = "0.30"

[dev-dependencies]
# To sign test invoices.
bitcoin = { version = "0.32", default-features = false, features = ["std", "secp-recovery"] }
nostr-sdk = { version = "0.45.1", features = ["local-relay"] }

[lints]
workspace = true
