[package]
name = "bipnip-agent"
description = "The bipnip agent: runs next to a node runner's Lightning node, holds its keys, trades fiat and liquidity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bipnip-agent"
path = "src/main.rs"

[features]
# Talk to an LND node (needs `protoc` at build time; see bipnip-ln).
lnd = ["bipnip-ln/lnd"]

[dependencies]
bipnip-ln.workspace = true
async-trait.workspace = true
# The crate nostr's NIP-06 uses; `rand` to generate a new mnemonic.
bip39 = { version = "2.1", features = ["rand"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
toml = "0.8"
# bipnip-core main (#2): Mostro's protocol types plus the node binding.
mostro-core = { git = "https://github.com/SovereignTechnology/bipnip-core", rev = "282e28b6c6a4b3020ee2f9d4e4f385e0d2373564" }
# The versions bipnip-core resolves, so key and event types are the same types.
nostr-sdk = "0.45.1"
# NIP-06 (mnemonic → keys) is a feature of the nostr crate nostr-sdk re-exports.
nostr = { version = "0.45.1", features = ["nip06"] }
zeroize = "1"
secp256k1 = "0.30"

[dev-dependencies]
nostr-sdk = { version = "0.45.1", features = ["local-relay"] }

[lints]
workspace = true
