[package]
name = "bipnip-ln-spike"
description = "M0 spike: Lightning signing vectors, LND's signer as a Nostr key, hold invoices by external hash"
version = "0.0.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace root, so it never joins the bipnip workspace.
[workspace]

[[bin]]
name = "ldk-spike"
path = "src/bin/ldk_spike.rs"

[[bin]]
name = "check"
path = "src/bin/check.rs"

[dependencies]
ldk-node = "=0.7.1"
# bipnip-core main after #1 (node_binding).
mostro-core = { git = "https://github.com/SovereignTechnology/bipnip-core", rev = "568d4768f48ed82616cf205b8fcc27fdc0eed867" }
nostr = { version = "=0.45.7", features = ["std"] }
serde_json = "1"
