[package]
name = "bipnip-ln-itest"
description = "Conformance run of bipnip-ln backends against real nodes on regtest (Kata only)"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace root: it needs the network (a git dependency) and protoc, which the main
# workspace's offline builds must not.
[workspace]

[[bin]]
name = "lnd-conformance"
path = "src/lnd.rs"

[[bin]]
name = "lease-e2e"
path = "src/lease.rs"

[[bin]]
name = "test-relay"
path = "src/relay.rs"

[dependencies]
nostr-sdk = { version = "0.45.1", features = ["local-relay"] }
bipnip-ln = { path = "../../crates/bipnip-ln", features = ["lnd"] }
bipnip-agent = { path = "../../crates/bipnip-agent", features = ["lnd"] }
# bipnip-core main (#3): the same revision the agent uses.
mostro-core = { git = "https://github.com/SovereignTechnology/bipnip-core", rev = "5daa0124b5ecb86bb32dc947a3d5659e7e1c8d64" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
